<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Set New Password - OptiLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Reuse the same stylesheets as the forgot-password page -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/forgot-password.css">
    <!-- Small override for the eye icon positioning (optional) -->
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 2.8rem; /* space for eye icon */
        }
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 1rem;
        }
        .toggle-password:hover {
            color: var(--primary-teal);
        }
    </style>
</head>
<body>
<div class="forgot-container">
    <div class="logo-section">
        <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663584504305/jlXamgVcAIcxXRwJ.jpg" alt="OptiLearn Logo" class="logo-image">
    </div>

    <div class="forgot-card">
        <div class="forgot-icon">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="forgot-title">Create new password</h1>
        <p class="forgot-subtitle">Your new password must be at least 6 characters.</p>

        <!-- New Password Field -->
        <div class="form-group password-wrapper">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="new-password" class="form-control" placeholder="New password">
            <i class="fa-regular fa-eye toggle-password" data-target="new-password"></i>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group password-wrapper">
            <i class="fa-solid fa-check-circle"></i>
            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password">
            <i class="fa-regular fa-eye toggle-password" data-target="confirm-password"></i>
        </div>

        <button class="btn-reset" id="update-btn">
            Update Password <i class="fa-solid fa-check"></i>
        </button>

        <div id="msg" class="message"></div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </div>
    <div class="footer-note">
        <i class="fa-regular fa-circle-question"></i> Remember your password? <a href="login.html" style="color: var(--primary-teal);">Sign in</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jxdllmwdyvhcsdvodnbb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZGxsbXdkeXZoY3Nkdm9kbmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDg2OTgsImV4cCI6MjA5Mjg4NDY5OH0.KlkSqiB_KRT6aQdN-olzIo6sYLZQ0ECA9KBoUs6F44g';
    // Use a unique variable name to avoid conflict with any existing global 'supabase'
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const updateBtn = document.getElementById('update-btn');
    const newPw = document.getElementById('new-password');
    const confirmPw = document.getElementById('confirm-password');
    const msgDiv = document.getElementById('msg');

    // ---------- Eye toggle logic ----------
    document.querySelectorAll('.toggle-password').forEach(icon => {
        icon.addEventListener('click', function () {
            const input = document.getElementById(this.dataset.target);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            // Swap eye icons
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    });

    // ---------- Password update logic ----------
    async function updatePassword() {
        const password = newPw.value;
        const confirm = confirmPw.value;

        if (!password || !confirm) {
            msgDiv.textContent = 'Please fill in both fields.';
            msgDiv.className = 'message error';
            return;
        }
        if (password !== confirm) {
            msgDiv.textContent = 'Passwords do not match.';
            msgDiv.className = 'message error';
            return;
        }
        if (password.length < 6) {
            msgDiv.textContent = 'Password must be at least 6 characters.';
            msgDiv.className = 'message error';
            return;
        }

        updateBtn.disabled = true;
        updateBtn.innerHTML = 'Updating... <i class="fa-solid fa-spinner fa-pulse"></i>';

        const { error } = await supabaseClient.auth.updateUser({ password: password });
        if (error) {
            msgDiv.textContent = error.message;
            msgDiv.className = 'message error';
        } else {
            msgDiv.textContent = '✅ Password updated! Redirecting to login...';
            msgDiv.className = 'message success';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
        updateBtn.disabled = false;
        updateBtn.innerHTML = 'Update Password <i class="fa-solid fa-check"></i>';
    }

    updateBtn.addEventListener('click', updatePassword);
    // Allow Enter key in the last field to trigger update
    confirmPw.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') updatePassword();
    });
    alert('Script loaded');
</script>
</body>
</html>
