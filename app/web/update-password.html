<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - OptiLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/update-password.css">
</head>
<body>
<div class="container">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663584504305/jlXamgVcAIcxXRwJ.jpg" alt="OptiLearn" class="logo-image">
    <div class="card">
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        <h1>Create new password</h1>
        <p>Your new password must be at least 6 characters.</p>
        <div class="form-group">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="new-password" placeholder="New password">
        </div>
        <div class="form-group">
            <i class="fa-solid fa-check-circle"></i>
            <input type="password" id="confirm-password" placeholder="Confirm new password">
        </div>
        <button id="update-btn">Update Password</button>
        <div id="msg" class="message"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/update-password.js"></script>
</body>
</html>
