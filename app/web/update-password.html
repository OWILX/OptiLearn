<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - OptiLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Same styling as forgot-password page – reuse or inline */
        body {
            background: linear-gradient(135deg, #F0F4FF 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 450px;
            width: 100%;
        }
        .logo-image {
            width: 120px;
            display: block;
            margin: 0 auto 1.5rem;
        }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon {
            font-size: 3rem;
            color: #108080;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .form-group {
            position: relative;
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .form-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 0.9rem 0.9rem 0.9rem 2.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #108080;
            box-shadow: 0 0 0 3px rgba(16,128,128,0.1);
        }
        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #108080, #16248c);
            color: white;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .message {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 0.8rem;
            font-size: 0.85rem;
            display: none;
        }
        .success { background: #e6f7e6; color: #2e7d32; display: block; }
        .error { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body>
<div class="container">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663584504305/jlXamgVcAIcxXRwJ.jpg" alt="OptiLearn" class="logo-image">
    <div class="card">
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        <h1>Create new password</h1>
        <p>Your new password must be at least 6 characters.</p>
        <div class="form-group">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="new-password" placeholder="New password">
        </div>
        <div class="form-group">
            <i class="fa-solid fa-check-circle"></i>
            <input type="password" id="confirm-password" placeholder="Confirm new password">
        </div>
        <button id="update-btn">Update Password</button>
        <div id="msg" class="message"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jxdllmwdyvhcsdvodnbb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZGxsbXdkeXZoY3Nkdm9kbmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDg2OTgsImV4cCI6MjA5Mjg4NDY5OH0.KlkSqiB_KRT6aQdN-olzIo6sYLZQ0ECA9KBoUs6F44g';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const updateBtn = document.getElementById('update-btn');
    const newPw = document.getElementById('new-password');
    const confirmPw = document.getElementById('confirm-password');
    const msgDiv = document.getElementById('msg');

    async function updatePassword() {
        const password = newPw.value;
        const confirm = confirmPw.value;
        if (!password || !confirm) {
            msgDiv.textContent = 'Please fill in both fields.';
            msgDiv.className = 'message error';
            return;
        }
        if (password !== confirm) {
            msgDiv.textContent = 'Passwords do not match.';
            msgDiv.className = 'message error';
            return;
        }
        if (password.length < 6) {
            msgDiv.textContent = 'Password must be at least 6 characters.';
            msgDiv.className = 'message error';
            return;
        }

        updateBtn.disabled = true;
        updateBtn.innerHTML = 'Updating... <i class="fa-solid fa-spinner fa-pulse"></i>';

        const { error } = await supabase.auth.updateUser({ password: password });
        if (error) {
            msgDiv.textContent = error.message;
            msgDiv.className = 'message error';
        } else {
            msgDiv.textContent = '✅ Password updated! Redirecting to login...';
            msgDiv.className = 'message success';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
        updateBtn.disabled = false;
        updateBtn.innerHTML = 'Update Password';
    }
    updateBtn.addEventListener('click', updatePassword);
</script>
</body>
</html>
