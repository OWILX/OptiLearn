<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OptiLearn - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        /* Additional page-specific styles – keeps consistency with login */
        body {
            background: linear-gradient(135deg, #F0F4FF 0%, #FFFFFF 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .forgot-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-image {
            width: clamp(100px, 30vw, 140px);
            height: auto;
        }

        .forgot-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 32, 96, 0.05);
            text-align: center;
        }

        .forgot-icon {
            font-size: 3.5rem;
            color: var(--primary-teal);
            margin-bottom: 1rem;
        }

        .forgot-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .forgot-subtitle {
            color: var(--text-grey);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3.2rem;
            border: 2px solid transparent;
            border-radius: 1rem;
            background-color: #f8f9fc;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--primary-teal);
            background-color: #fff;
            box-shadow: 0 0 0 5px rgba(0, 128, 128, 0.08);
        }

        .form-control:focus + i {
            color: var(--primary-teal);
        }

        .btn-reset {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 1rem;
            background: linear-gradient(135deg, var(--primary-teal), var(--primary-blue));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0, 32, 96, 0.15);
            margin-top: 0.5rem;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 15px 25px rgba(0, 32, 96, 0.2);
        }

        .btn-reset:active {
            transform: scale(0.97);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            display: none;
        }

        .message.success {
            background: #e6f7e6;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            display: block;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-grey);
        }

        @media (max-width: 600px) {
            .forgot-card {
                padding: 1.8rem;
            }
            .forgot-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="forgot-container">
    <div class="logo-section">
        <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663584504305/jlXamgVcAIcxXRwJ.jpg" alt="OptiLearn Logo" class="logo-image">
    </div>

    <div class="forgot-card">
        <div class="forgot-icon">
            <i class="fa-regular fa-envelope"></i>
        </div>
        <h1 class="forgot-title">Reset Password</h1>
        <p class="forgot-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <div class="form-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="reset-email" class="form-control" placeholder="Your registered email" autocomplete="email">
        </div>

        <button class="btn-reset" id="reset-btn">
            Send Reset Link <i class="fa-solid fa-paper-plane"></i>
        </button>

        <div id="message-box" class="message"></div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </div>
    <div class="footer-note">
        <i class="fa-regular fa-circle-question"></i> Remember your password? <a href="login.html" style="color: var(--primary-teal);">Sign in</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Supabase configuration (same as your login)
    const SUPABASE_URL = 'https://jxdllmwdyvhcsdvodnbb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZGxsbXdkeXZoY3Nkdm9kbmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDg2OTgsImV4cCI6MjA5Mjg4NDY5OH0.KlkSqiB_KRT6aQdN-olzIo6sYLZQ0ECA9KBoUs6F44g';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DOM elements
    const resetBtn = document.getElementById('reset-btn');
    const emailInput = document.getElementById('reset-email');
    const messageBox = document.getElementById('message-box');

    function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.className = `message ${isError ? 'error' : 'success'}`;
        // Auto-hide after 5 seconds
        setTimeout(() => {
            messageBox.style.display = 'none';
            messageBox.className = 'message';
        }, 5000);
    }

    async function sendResetLink() {
        const email = emailInput.value.trim();
        if (!email) {
            showMessage('Please enter your email address.', true);
            return;
        }

        // Basic email validation
        const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
        if (!emailRegex.test(email)) {
            showMessage('Please enter a valid email address.', true);
            return;
        }

        // Disable button during request
        resetBtn.disabled = true;
        resetBtn.innerHTML = 'Sending... <i class="fa-solid fa-spinner fa-pulse"></i>';

        try {
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + 'update-password.html', // page where user sets new password
            });

            if (error) {
                if (error.message.includes('User not found')) {
                    showMessage('No account found with that email address.', true);
                } else {
                    showMessage(error.message, true);
                }
            } else {
                showMessage('✅ Password reset link sent! Check your email (including spam folder).');
                emailInput.value = ''; // clear for privacy
            }
        } catch (err) {
            console.error(err);
            showMessage('Network error. Please try again later.', true);
        } finally {
            resetBtn.disabled = false;
            resetBtn.innerHTML = 'Send Reset Link <i class="fa-solid fa-paper-plane"></i>';
        }
    }

    resetBtn.addEventListener('click', sendResetLink);
    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendResetLink();
    });
</script>
</body>
</html>
