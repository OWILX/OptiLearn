<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiLearn Results</title>

<link rel="stylesheet" href="assets/css/result.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">

<header class="header">

<div class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
</div>

<div class="page-title">
Exam Results
</div>

<div class="share-btn">
<i class="fa-solid fa-share"></i>
</div>

</header>

<main>

<section class="score-hero">

<div class="score-circle">
78%
</div>

<h1>Great Progress!</h1>

<p>
You improved by 12% from your previous attempt.
</p>

</section>

<section class="analytics-grid">

<div class="analytics-card">
<h3>Mathematics</h3>
<div class="mini-bar">
<div class="fill" style="width:82%"></div>
</div>
<span>82%</span>
</div>

<div class="analytics-card">
<h3>English</h3>
<div class="mini-bar">
<div class="fill" style="width:74%"></div>
</div>
<span>74%</span>
</div>

<div class="analytics-card">
<h3>Physics</h3>
<div class="mini-bar">
<div class="fill" style="width:66%"></div>
</div>
<span>66%</span>
</div>

<div class="analytics-card">
<h3>Chemistry</h3>
<div class="mini-bar">
<div class="fill" style="width:81%"></div>
</div>
<span>81%</span>
</div>

</section>

<section class="summary-card">

<div class="summary-item">
<span>Correct Answers</span>
<strong>47</strong>
</div>

<div class="summary-item">
<span>Wrong Answers</span>
<strong>13</strong>
</div>

<div class="summary-item">
<span>Time Used</span>
<strong>1h 12m</strong>
</div>

</section>

<button class="btn-review">
Review Questions
<i class="fa-solid fa-book-open"></i>
</button>

</main>

</div>

<script src="assets/js/result.js"></script>
</body>
</html>
