<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiLearn CBT Exam</title>
<link rel="stylesheet" href="assets/css/exam.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="exam-container">

<header class="exam-header">

<div class="exam-subject">
Use of English
</div>

<div class="timer-box" id="timer">
01:45:22
</div>

</header>

<main class="question-wrapper">

<div class="question-number">
Question 12 of 60
</div>

<div class="question-card">

<h2 class="question-text">
Choose the option nearest in meaning to the underlined word.
</h2>

<div class="passage">
The principal was <strong>elated</strong> after the school's performance.
</div>

<div class="options-list">

<label class="option-item">
<input type="radio" name="answer">
<span>Sad</span>
</label>

<label class="option-item active">
<input type="radio" name="answer">
<span>Excited</span>
</label>

<label class="option-item">
<input type="radio" name="answer">
<span>Confused</span>
</label>

<label class="option-item">
<input type="radio" name="answer">
<span>Angry</span>
</label>

</div>

</div>

<div class="question-actions">
<button class="btn-secondary">
<i class="fa-solid fa-arrow-left"></i>
Previous
</button>

<button class="btn-primary">
Next
<i class="fa-solid fa-arrow-right"></i>
</button>
</div>

</main>

<nav class="navigator-panel">
<div class="nav-title">Questions</div>

<div class="question-grid">
<button class="q-btn done">1</button>
<button class="q-btn done">2</button>
<button class="q-btn current">3</button>
<button class="q-btn">4</button>
<button class="q-btn">5</button>
<button class="q-btn marked">6</button>
</div>

<button class="submit-btn">
Submit Exam
</button>
</nav>

</div>

<script src="assets/js/exam.js"></script>
</body>
</html>
