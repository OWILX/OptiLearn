<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiLearn Leaderboard</title>

<link rel="stylesheet" href="assets/css/leaderboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">

<header class="header">
<h1>Leaderboard</h1>
<div class="week-pill">This Week</div>
</header>

<section class="top-three">

<div class="leaderboard-card second">
<div class="rank">2</div>
<div class="student-name">Sarah</div>
<div class="student-score">331</div>
</div>

<div class="leaderboard-card first">
<div class="rank">1</div>
<div class="student-name">Emeka</div>
<div class="student-score">342</div>
</div>

<div class="leaderboard-card third">
<div class="rank">3</div>
<div class="student-name">David</div>
<div class="student-score">324</div>
</div>

</section>

<section class="other-ranks">

<div class="rank-item">
<span>#4</span>
<span>Grace</span>
<strong>317</strong>
</div>

<div class="rank-item">
<span>#5</span>
<span>Daniel</span>
<strong>305</strong>
</div>

<div class="rank-item">
<span>#6</span>
<span>Favour</span>
<strong>301</strong>
</div>

</section>

<div class="streak-card">
<i class="fa-solid fa-fire"></i>
<div>
<div class="streak-number">18 Day Streak</div>
<div class="streak-desc">Keep practicing daily</div>
</div>
</div>

</div>

</body>
</html>
